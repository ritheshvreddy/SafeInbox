# SafeInbox: MongoDB + Flask backend + React frontend (served by nginx).
#   docker compose up -d --build      -> open http://localhost:3000
# Settings come from a .env file next to this one (copy .env.example).

# Fixed project name so manual runs and Jenkins deployments manage the same containers.
name: safeinbox

services:
  mongo:
    image: mongo:7.0
    container_name: safeinbox-mongo
    restart: unless-stopped
    ports:
      # Published on 27018 so it doesn't clash with a MongoDB installed on your machine (27017).
      # `python app.py` can use it with MONGO_URI=mongodb://localhost:27018/safeinbox
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ./safeinbox-backend
      target: runtime
    image: safeinbox-backend:latest
    container_name: safeinbox-backend
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongo:27017/safeinbox
      MONGO_FALLBACK_TO_MEMORY: "false"
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-30}
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "5000:5000"
    volumes:
      - backend-instance:/app/instance   # generated keys + retrained models survive restarts
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in .env}
    image: safeinbox-frontend:latest
    container_name: safeinbox-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
  backend-instance:
