<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafeInbox - AI spam & phishing checker for Gmail</title>
    <meta name="description" content="SafeInbox scans your unread Gmail emails and shows a spam score, a short summary, the reasons behind each decision and warnings for phishing links." />
    <meta name="theme-color" content="#4338ca" />
    <!-- Google Search Console ownership proof (needed for OAuth branding verification). Do not remove. -->
    <meta name="google-site-verification" content="DlbnlcADxzmFEDWqS_hOQegdXeXuKMNXk4V69BciVso" />

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Icons -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Social sharing (Open Graph / Twitter). __SITE_URL__ is replaced at build time (see vite.config.js). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SafeInbox" />
    <meta property="og:title" content="SafeInbox - AI spam & phishing checker for Gmail" />
    <meta property="og:description" content="Spam scores, phishing alerts and short summaries for your unread Gmail emails." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SafeInbox logo: an envelope with a green check mark" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="SafeInbox - AI spam & phishing checker for Gmail" />
    <meta name="twitter:description" content="Spam scores, phishing alerts and short summaries for your unread Gmail emails." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />

    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
